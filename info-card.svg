<svg xmlns="http://www.w3.org/2000/svg" width="490" height="340" viewBox="0 0 490 340" role="img" aria-label="Muzammil: engineer and inventor building J.A.R.V.I.S. Mark 3">
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:13px}
.t{fill:#7d8fa3;font-size:12px}
.h{fill:#ffc857;font-weight:700;font-size:14px}
.k{fill:#5fe3ff}
.v{fill:#d7e3ee}
.d{fill:#7d8fa3}
.l{opacity:0;animation:in .5s ease-out forwards}
.cur{animation:blink 1.1s steps(2,jump-none) infinite}
